/* =====================================================
   📚 МОДУЛЬДЕРДІ КӨРСЕТУ
   ===================================================== */

const modulesContainer = document.getElementById("modules");

modules.forEach((module, moduleIndex) => {

    const moduleElement = document.createElement("div");

    moduleElement.className = "module";

    moduleElement.innerHTML = `
        <div class="module-title">
            ${module.title}
        </div>
    `;

    module.lessons.forEach((lesson, lessonIndex) => {

        const lessonElement = document.createElement("div");

        lessonElement.className = "lesson";

        lessonElement.innerHTML = `
            <div class="lesson-number">
                Сабақ ${lessonIndex + 1}
            </div>

            <div class="lesson-title">
                ${lesson.title}
            </div>
        `;

        lessonElement.onclick = () => {
            openLesson(moduleIndex, lessonIndex);
        };

        moduleElement.appendChild(lessonElement);
    });

    modulesContainer.appendChild(moduleElement);
});


/* =====================================================
   📖 САБАҚТЫ АШУ
   ===================================================== */

function openLesson(moduleIndex, lessonIndex) {

    const module = modules[moduleIndex];
    const lesson = module.lessons[lessonIndex];

    document.getElementById("home").style.display = "none";
    document.getElementById("lessonPage").style.display = "block";

    document.getElementById("detailModule").innerText =
        module.title + " • Сабақ " + (lessonIndex + 1);

    document.getElementById("detailTitle").innerText =
        lesson.title;

    document.getElementById("detailContent").innerHTML =
        lesson.content || "";

    const homeworkElement =
        document.getElementById("detailHomework");

    if (lesson.homework) {

        homeworkElement.innerHTML = `
            <div class="homework">
                <div class="homework-title">
                    📝 Үй тапсырма
                </div>

                <div class="homework-text">
                    ${lesson.homework}
                </div>
            </div>
        `;

    } else {

        homeworkElement.innerHTML = "";

    }

    window.scrollTo(0, 0);
}


/* =====================================================
   🏠 БАСТЫ БЕТКЕ ҚАЙТУ
   ===================================================== */

function goHome() {

    document.getElementById("lessonPage").style.display = "none";
    document.getElementById("home").style.display = "block";

    window.scrollTo(0, 0);
}
